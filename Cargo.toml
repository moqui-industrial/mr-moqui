# Candidate workspace. Crate cut: plans/Crate-Layout.md.
# Feature rows: plans/License-Review.md (resolved 2026-10-11).
# `cargo tree -p moqui` is the default binary. Cargo.lock is the exact resolve.
#
# license is CC0-1.0. The patent grant in LICENSE.md has no SPDX identifier.
# postgresql_embedded 0.21 / sqlx 0.9 require Rust 1.94. mysql_common 0.37
# pulls uuid 1.28, which requires Rust 1.89. This file does not set
# rust-version, so `cargo metadata` and `cargo tree` still run on older cargo.
# `cargo check -p moqui` needs Rust 1.94.

[workspace]
resolver = "2"
members = [
    "crates/moqui-lib",
    "crates/moqui-db",
    "crates/moqui-core",
    "crates/moqui-host",
    "crates/moqui",
]

[workspace.package]
edition = "2021"
license = "CC0-1.0"
publish = false
version = "0.1.0"

# `cargo clippy` fails on Clippy's default set. `priority = -1` lets an
# item `#[allow]` override one lint. Pedantic, nursery, and restriction
# stay off. `cargo lint` also denies rustc warnings.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Check with RUSTFLAGS=-Dwarnings instead of denying here, so a new rustc does not break a build.
[workspace.lints.rust]
unexpected_cfgs = { level = "deny", priority = -1 }

# Phase 6 unwinds across the service boundary. This is already the compiler default.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[workspace.dependencies]
moqui-lib = { path = "crates/moqui-lib" }
moqui-db = { path = "crates/moqui-db" }
moqui-core = { path = "crates/moqui-core" }
moqui-host = { path = "crates/moqui-host" }

# --- moqui-lib ---
jiff = "0.2"
# serde is already in the crate's default set. Named so it stays if defaults change.
rust_decimal = { version = "1", features = ["serde"] }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Signer stand-ins. Stay in RustCrypto (or aws-lc). No OpenSSL.
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
# Name rustls. On 0.13 that is aws-lc, but default-tls must not be inherited:
# a later release could point default-tls back at native-tls.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "json",
    "multipart",
    "charset",
] }

# --- moqui-core (no direct tokio, axum, postgres, mysql, or postgresql_embedded) ---
# Field encryption. pbkdf2 0.12 stays on hmac 0.12 and sha2 0.10.
# aes, cbc, and des share cipher 0.5. cbc alloc is the Vec padding API.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
des = "0.9"
pbkdf2 = "0.12"
md-5 = "0.10"

# Do not enable the feature named rustls-tls: on this crate it selects ring.
# hostname is an optional dependency feature. tokio1 stays off, so SMTP is not async.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "rustls",
    "aws-lc-rs",
    "webpki-roots",
] }
# Default feature is chrono. Quartz parsing uses jiff.
croner = { version = "4", default-features = false, features = ["jiff"] }
# No std feature on 0.6. Defaults are alloc, getrandom, and password-hash.
argon2 = { version = "0.6", features = ["password-hash"] }
csv = "1"
pulldown-cmark = "0.13"
totp-rs = { version = "6", default-features = false, features = [
    "std",
    "otpauth",
    "gen_secret",
] }
tracing = "0.1"
# CSPRNG for CHANGEME secrets written to runtime/.env. No /dev/urandom.
getrandom = { version = "0.3", features = ["std"] }
rquickjs = "0.14"
# Phase 6 is the first user. Not linked until then, so this line does not
# raise the MSRV of lib or core. 0.139.0 declares rust-version 1.94.0.
# 0.140 and later declare 1.95 or higher.
oxc_parser = "0.139"

# --- moqui-host ---
# rt-multi-thread is for axum. postgres::Client builds its own current_thread runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
# Defaults are tls-native-tls and theseus. bundled embeds the archive; see .cargo/config.toml.
postgresql_embedded = { version = "0.21", default-features = false, features = [
    "bundled",
    "blocking",
    "theseus",
    "tls-rustls-aws-lc-rs",
] }
postgres = { version = "0.19", default-features = false, features = ["with-jiff-0_2"] }
# Defaults are empty. ring stays off.
tokio-postgres-rustls = { version = "0.14", default-features = false, features = [
    "aws-lc-rs",
    "webpki-roots",
] }
# minimal (not minimal-rust) links system zlib. On this crate rustls-tls means aws-lc.
# time and chrono stay off. rustls-tls still pulls webpki 0.22, which pulls ring.
mysql = { version = "28", default-features = false, features = [
    "minimal-rust",
    "derive",
    "buffer-pool",
    "rustls-tls",
    "rust_decimal",
] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
# Pin the 0.6 line so 0.7 is not selected.
tower-http = { version = "0.6", default-features = false, features = [
    "compression-gzip",
    "fs",
    "set-header",
] }
# fetcher, native-tls, and rustls on 0.9 only enable chromiumoxide_fetcher.
# There is no tokio-runtime feature. Leave the fetcher off.
chromiumoxide = { version = "0.9", default-features = false }
# MPL-2.0 hold. Off unless moqui-host is built with pdf-servo.
servo = "0.7"
# SSH client and server. ring, des, and dsa stay off. aws-lc-rs matches the other TLS crates.
russh = { version = "0.64", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
# SFTP v3 subsystem. No dependency on russh; the host feeds it the channel bytes.
russh-sftp = "3"
# OIDC and OAuth 2 client. Default feature is the native JWS verifier.
# Loopback, metrics, and the experimental key-binding feature stay off.
huskarl = "0.11"
