# Candidate workspace. Crate cut: plans/archive/Crate-Layout.md.
# Feature rows: plans/archive/License-Review.md (resolved 2026-10-11).
# `cargo tree -p moqui` is the default binary. Cargo.lock is the exact resolve.
#
# license is CC0-1.0. The patent grant in LICENSE.md has no SPDX identifier.
# postgresql_embedded 0.21 / sqlx 0.9 require Rust 1.94. mysql_common 0.37
# pulls uuid 1.28, which requires Rust 1.89. This file does not set
# rust-version, so `cargo metadata` and `cargo tree` still run on older cargo.
# `cargo check -p moqui` needs Rust 1.94.

[workspace]
resolver = "2"
members = [
    "crates/moqui-lib",
    "crates/moqui-db",
    "crates/moqui-core",
    "crates/moqui-host",
    "crates/moqui-browser",
    "crates/moqui",
]

[workspace.package]
edition = "2021"
license = "CC0-1.0"
publish = false
version = "0.1.0"

# `cargo clippy` fails on Clippy's default set. `priority = -1` lets an
# item `#[allow]` override one lint. Pedantic, nursery, and restriction
# stay off. `cargo lint` also denies rustc warnings.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Check with RUSTFLAGS=-Dwarnings instead of denying here, so a new rustc does not break a build.
[workspace.lints.rust]
unexpected_cfgs = { level = "deny", priority = -1 }

# Phase 6 unwinds across the service boundary. This is already the compiler default.
[profile.dev]
panic = "unwind"

# Dependencies optimized in dev and test builds; the workspace crates stay at opt-level 0. A debug
# screen render was about 12x slower than release with unoptimized dependencies, which made the
# screen tests take minutes. Costs one longer build of the dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "unwind"

[workspace.dependencies]
moqui-lib = { path = "crates/moqui-lib" }
moqui-db = { path = "crates/moqui-db" }
# default-features off so moqui-browser can leave out mail, http, and cluster-tls; moqui-host names them.
moqui-core = { path = "crates/moqui-core", default-features = false }
moqui-host = { path = "crates/moqui-host" }

# --- moqui-lib ---
jiff = "0.2"
# serde is already in the crate's default set. Named so it stays if defaults change.
rust_decimal = { version = "1", features = ["serde"] }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
# Signer stand-ins. Stay in RustCrypto (or aws-lc). No OpenSSL.
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
# SimpleSigner (RSA SHA1withRSA, PKCS#1 v1.5). The rsa release candidate is the one russh and huskarl already
# resolve, so the graph has one rsa. It needs digest 0.11, so its SHA-1 is sha1 0.11 under another name and the
# SHA-2 variants come from rsa's own re-export. plans/archive/License-Review.md records RUSTSEC-2023-0071.
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
sha1-digest-011 = { package = "sha1", version = "0.11", features = ["oid"] }
rand_core = "0.10"
# Name rustls. On 0.13 that is aws-lc, but default-tls must not be inherited:
# a later release could point default-tls back at native-tls.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "json",
    "multipart",
    "charset",
] }

# Charsets for SFTP text (SystemMessageRemote.remoteCharset). Already in the graph under reqwest.
encoding_rs = "0.8"

# --- moqui-core (no direct tokio, axum, postgres, mysql, or postgresql_embedded) ---
# Field encryption. pbkdf2 0.12 stays on hmac 0.12 and sha2 0.10.
# aes, cbc, and des share cipher 0.5. cbc alloc is the Vec padding API.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
des = "0.9"
pbkdf2 = "0.12"
md-5 = "0.10"

# Do not enable the feature named rustls-tls: on this crate it selects ring.
# hostname is an optional dependency feature. tokio1 stays off, so SMTP is not async.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "rustls",
    "aws-lc-rs",
    "webpki-roots",
] }
# Blocking IMAP. The default feature tls is native-tls and stays off.
# 2.4.1 has no rustls feature. rustls-connector is a dev-dependency and is not linked.
# The TCP stream is wrapped with rustls below.
imap = { version = "2.4", default-features = false }
# Inbound MIME for poll#EmailServer: nested multiparts, RFC 2047 words, charsets, folded headers. Defaults are
# empty; the single-byte charsets are built in, and `full_encoding` (encoding_rs for multi-byte CJK) stays off.
mail-parser = { version = "0.11", default-features = false }
# Direct so IMAP and POP3 can build a ClientConfig on aws-lc. ring stays off.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1"
# Self-signed cluster certificate. ring and pem stay off. aws-lc-rs is the crypto provider.
# x509-parser and fips stay off. time is certificate validity only; clocks stay jiff.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
# Default feature is chrono. Quartz parsing uses jiff.
croner = { version = "4", default-features = false, features = ["jiff"] }
# No std feature on 0.6. Defaults are alloc, getrandom, and password-hash.
argon2 = { version = "0.6", features = ["password-hash"] }
csv = "1"
# html only. The default set also links getopts for the crate's CLI.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
totp-rs = { version = "6", default-features = false, features = [
    "std",
    "otpauth",
    "gen_secret",
] }
tracing = "0.1"
# CSPRNG for CHANGEME secrets written to runtime/.env. No /dev/urandom.
getrandom = { version = "0.3", features = ["std"] }
# Exact: `keep_assigned` in moqui-core script/runtime/entities.rs depends on how this version owns the value an
# exotic set is given. Re-check it, and its test, before moving this.
rquickjs = "=0.14.0"
# Phase 6 is the first user. Not linked until then, so this line does not
# raise the MSRV of lib or core. 0.139.0 declares rust-version 1.94.0.
# 0.140 and later declare 1.95 or higher.
oxc_parser = "0.139"
# The ESTree JSON of a parsed expression, for the server-static compatibility walk. Already in the tree under oxc_parser.
oxc_ast = { version = "0.139", features = ["serialize"] }
# HTML cleaning for allow-html="safe" service parameters. MIT OR Apache-2.0. Builder::default() is the
# conservative maintained allow-list; there is no custom list in this repo.
ammonia = "4"
# The xlsx render mode (the moqui-poi port). Defaults are empty; dates are written as Excel serial numbers, so the
# chrono and jiff features stay off. Its zip dependency is `deflate` (zopfli and flate2 on zlib-rs).
rust_xlsxwriter = { version = "0.99", default-features = false }
# read#Spreadsheet: xlsx, xlsm, xlsb, xls, and ods. Defaults are empty; chrono (dates) stays off, dates are read as
# Excel serial numbers. Shares zip with rust_xlsxwriter.
calamine = { version = "0.36", default-features = false }
# The moqui-image port. Defaults (rayon, and every format including avif and exr) stay off; these are the formats the
# Java component read and wrote through ImageIO and TwelveMonkeys, less wbmp and SVG.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

# --- moqui-host ---
# rt-multi-thread is for axum. postgres::Client builds its own current_thread runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util"] }
# Defaults are tls-native-tls and theseus. bundled embeds the archive; see .cargo/config.toml.
postgresql_embedded = { version = "0.21", default-features = false, features = [
    "bundled",
    "blocking",
    "theseus",
    "tls-rustls-aws-lc-rs",
] }
postgres = { version = "0.19", default-features = false, features = ["with-jiff-0_2"] }
# Defaults are empty. ring stays off.
tokio-postgres-rustls = { version = "0.14", default-features = false, features = [
    "aws-lc-rs",
    "webpki-roots",
] }
# minimal (not minimal-rust) links system zlib. On this crate rustls-tls means aws-lc.
# time and chrono stay off. rustls-tls still pulls webpki 0.22, which pulls ring.
mysql = { version = "28", default-features = false, features = [
    "minimal-rust",
    "derive",
    "buffer-pool",
    "rustls-tls",
    "rust_decimal",
] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
# Pin the 0.6 line so 0.7 is not selected.
tower-http = { version = "0.6", default-features = false, features = [
    "compression-gzip",
    "fs",
    "set-header",
] }
# The plain listener serves each connection itself so hyper has a timer for its header read timeout (axum::serve sets
# none). Both are already in the graph under axum with these features.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "http1"] }
# The PDF browser's DevTools socket (crates/moqui-host/src/pdf). Already in the graph under axum's ws feature.
# chromiumoxide was the plan; its untagged-enum message parsing fails under serde_json arbitrary_precision.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# MPL-2.0 hold. Off unless moqui-host is built with pdf-servo.
servo = "0.7"
# SSH client and server. ring, des, and dsa stay off. aws-lc-rs matches the other TLS crates.
russh = { version = "0.64", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
# SFTP v3 subsystem. No dependency on russh; the host feeds it the channel bytes.
russh-sftp = "3"
# huskarl's HTTP request and body types, and the form encoding of the SSO callback. Already in the graph under it.
http = "1"
bytes = "1"
form_urlencoded = "1"
# Apple's client secret JWT (ES256). The same p256 huskarl-crypto-native and russh link.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
# OIDC and OAuth 2 client. Default feature is the native JWS verifier.
# Loopback, metrics, and the experimental key-binding feature stay off.
huskarl = "0.11"
# IPP message encoding for network printing (the moqui-cups port). The clients stay off, so the request goes through
# the async reqwest above on the edge runtime; no second HTTP stack.
ipp = { version = "7", default-features = false }

# --- moqui-browser ---
# The browser's local database (plans/archive/Wasm.md). bundled compiles the SQLite amalgamation with the
# target C compiler, which is emcc for wasm32-unknown-emscripten. SQLite is public domain.
# 0.38, not 0.40: servo-net (pdf-servo) pins it, and two libsqlite3-sys cannot link sqlite3 in one graph.
rusqlite = { version = "0.38", features = ["bundled"] }
