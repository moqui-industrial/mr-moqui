# MR Moqui with external Postgres for entities and OpenSearch for search.
#
#   podman compose -f podman/moqui-postgres-opensearch-compose.yml up -d
#
# OpenSearch is HTTP on the compose network only. The client verifies TLS and has no custom CA,
# and the image's HTTPS certificate is self-signed, so the security plugin is off and port 9200
# is not published. The host still needs vm.max_map_count=262144 (see podman/README.md).
# bootstrap.memory_lock is off because rootless Podman usually cannot grant IPC_LOCK.

name: moqui

services:
  moqui:
    image: localhost/moqui:latest
    restart: unless-stopped
    init: false
    stop_grace_period: 60s
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - moqui-data:/var/lib/moqui
    environment:
      instance_purpose: production
      entity_ds_crypt_pass: ${MOQUI_CRYPT_PASS:-}
      entity_ds_db_conf: postgres
      entity_ds_host: postgres
      entity_ds_port: "5432"
      entity_ds_database: ${MOQUI_DB_NAME:-moqui}
      entity_ds_schema: public
      entity_ds_user: ${MOQUI_DB_USER:-moqui}
      entity_ds_password: ${MOQUI_DB_PASSWORD:-moqui}
      entity_ds_sslmode: disable
      search_backend: opensearch
      elasticsearch_url: http://opensearch:9200
      opensearch_run: "false"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOQUI_DB_NAME:-moqui}
      POSTGRES_USER: ${MOQUI_DB_USER:-moqui}
      POSTGRES_PASSWORD: ${MOQUI_DB_PASSWORD:-moqui}
    volumes:
      - moqui-postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOQUI_DB_USER:-moqui} -d ${MOQUI_DB_NAME:-moqui}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The OpenSearch image runs as uid 1000 and exits if it is root, so it cannot chown a new
  # volume. This one-shot runs as root and only chowns the data directory. Docker Compose, the
  # usual `podman compose` provider, drops Podman's :U volume flag, so the chown is explicit.
  opensearch-init:
    image: docker.io/library/debian:13-slim
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - moqui-opensearch:/data
    restart: "no"

  opensearch:
    image: docker.io/opensearchproject/opensearch:3.4.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "false"
      network.host: 0.0.0.0
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - moqui-opensearch:/usr/share/opensearch/data
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  moqui-data:
  moqui-postgres:
  moqui-opensearch:
