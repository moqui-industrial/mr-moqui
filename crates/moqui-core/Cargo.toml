[package]
name = "moqui-core"
description = "Framework. Synchronous and multi-threaded. No listen socket and no database driver."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No direct tokio, axum, postgres, mysql, or postgresql_embedded.
# moqui-lib's http feature links blocking reqwest, which starts its own runtime.
# lettre does not enable tokio1, so the SMTP transport does not pull Tokio.

[dependencies]
moqui-lib = { workspace = true, features = ["http"] }
moqui-db = { workspace = true }
rquickjs = { workspace = true }
lettre = { workspace = true }
croner = { workspace = true }
argon2 = { workspace = true }
csv = { workspace = true }
pulldown-cmark = { workspace = true }
totp-rs = { workspace = true }
tracing = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
des = { workspace = true }
pbkdf2 = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
