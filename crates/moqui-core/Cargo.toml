[package]
name = "moqui-core"
description = "Framework. Synchronous and multi-threaded. No listen socket and no database driver."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No direct tokio, axum, postgres, mysql, or postgresql_embedded.
# moqui-lib http is blocking reqwest. rquickjs, croner, argon2,
# pulldown-cmark, and totp-rs stay workspace pins and are not linked here.
# lettre SMTP is blocking (tokio1 off). imap is blocking (native-tls off).

[dependencies]
moqui-lib = { workspace = true, features = ["http"] }
moqui-db = { workspace = true }
csv = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
rquickjs = { workspace = true, features = ["macro"] }
aes = { workspace = true }
cbc = { workspace = true }
des = { workspace = true }
pbkdf2 = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
sha1 = { workspace = true }
oxc_parser = { workspace = true }
ammonia = { workspace = true }
croner = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
lettre = { workspace = true }
imap = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
rcgen = { workspace = true }

[lints]
workspace = true
