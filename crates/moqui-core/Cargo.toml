[package]
name = "moqui-core"
description = "Framework. Synchronous and multi-threaded. No listen socket and no database driver."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No direct tokio, axum, postgres, mysql, or postgresql_embedded.
# moqui-lib http is blocking reqwest. rquickjs, croner, argon2,
# pulldown-cmark, and totp-rs stay workspace pins. totp-rs is the second
# factor of phase 11, with qr off as in plans/archive/License-Review.md.
# lettre SMTP is blocking (tokio1 off). imap is blocking (native-tls off).

[dependencies]
inventory = { workspace = true }
moqui-lib = { workspace = true }
moqui-db = { workspace = true }
csv = { workspace = true }
encoding_rs = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
rquickjs = { workspace = true, features = ["macro"] }
aes = { workspace = true }
cbc = { workspace = true }
des = { workspace = true }
pbkdf2 = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
sha1 = { workspace = true }
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_span = { workspace = true }
ammonia = { workspace = true }
croner = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lettre = { workspace = true, optional = true }
imap = { workspace = true, optional = true }
mail-parser = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
totp-rs = { workspace = true }
rust_xlsxwriter = { workspace = true }
calamine = { workspace = true }
zip = { workspace = true }
image = { workspace = true }

# No prebuilt QuickJS bindings ship for this target. bindgen needs libclang and the emsdk sysroot;
# scripts/wasm-env.sh sets both.
[target.'cfg(target_os = "emscripten")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

# Default on. The browser build (crates/moqui-browser, plans/archive/Wasm.md) turns all three off so no
# socket, TLS (aws-lc), or blocking-HTTP code is linked.
[features]
default = ["mail", "http", "cluster-tls"]
# Outbound SMTP, IMAP and POP3 poll, inbound MIME.
mail = ["dep:lettre", "dep:imap", "dep:mail-parser", "dep:rustls", "dep:webpki-roots"]
# remote-rest services, http resource locations, and the OpenSearch backend (blocking reqwest).
http = ["moqui-lib/http"]
# Generated self-signed cluster certificate.
cluster-tls = ["dep:rcgen"]

[lints]
workspace = true
