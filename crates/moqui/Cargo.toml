[package]
name = "moqui"
description = "Binary. CLI and process entry."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The packages of moqui-host (docs/Packaging.md). `./moq build` picks one with --no-default-features.
[features]
default = ["maximal"]
lite = ["moqui-host/lite"]
enterprise = ["moqui-host/enterprise"]
maximal = ["moqui-host/maximal"]

[dependencies]
moqui-host = { workspace = true }
# Component crates kept in runtime/base-component; each adds nothing unless its component loads.
example = { workspace = true }

[lints]
workspace = true
