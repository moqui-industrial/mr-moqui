[package]
name = "moqui"
description = "Binary. CLI and process entry."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The packages of moqui-host (docs/Packaging.md). `./moq build` picks one with --no-default-features.
[features]
default = ["maximal"]
lite = ["moqui-host/lite"]
enterprise = ["moqui-host/enterprise"]
maximal = ["moqui-host/maximal"]
# The SMTP listener for hosted and shared mail accounts (docs/Mail-Inbound.md), in Enterprise and Maximal; for a
# Default build `./moq build -- --features inbound-smtp`.
inbound-smtp = ["moqui-host/inbound-smtp"]
# The screen client. Not part of lite, enterprise, or maximal: those builds stay free of Revue, because `moqui`
# defaults to maximal and `cargo check -p moqui` must not compile it.
tui = ["moqui-host/tui"]

[dependencies]
moqui-host = { workspace = true }
# Component crates kept in runtime/base-component; each adds nothing unless its component loads.
example = { workspace = true }

[lints]
workspace = true
