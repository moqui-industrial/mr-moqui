[package]
name = "moqui-tui"
description = "Terminal screen client. The model and layout do not depend on Revue."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ui"]
# Serde model, link, layout, and the input decoder. No Revue.
model = []
# Revue interpreter, local event loop, and the in-memory session draw.
ui = ["model", "dep:revue"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
revue = { workspace = true, optional = true, default-features = false, features = ["markdown"] }

[dev-dependencies]
unicode-width = "0.2"

[lints]
workspace = true

[[example]]
name = "gallery"
required-features = ["ui"]
