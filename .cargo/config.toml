# postgresql_embedded's bundled build reads POSTGRESQL_VERSION (default "*")
# and embeds that theseus archive. "=18.6.0" is an exact VersionReq.
# force keeps a shell variable from unpinning the archive reviewed in
# plans/License-Review.md. bundled does not change the crate graph; it
# downloads the archive into the build when the host is compiled.
[alias]
# The tests marked `#[ignore = "slow: ..."]`, which the default `cargo test` skips: the all-screens render, the REST restart gate,
# the xlsx and print tools, the screen report and the notification socket. `cargo test -- --include-ignored` runs everything.
test-slow = "test -p moqui-host --test it -- --ignored tools_screens:: gate2:: tool_components:: qvt_report:: notws::"
# rustc warnings plus Clippy. The default Clippy set is already deny
# in the workspace lints.
lint = "clippy --workspace --all-targets -- -D warnings"

[env]
POSTGRESQL_VERSION = { value = "=18.6.0", force = true }

# The browser build (plans/Wasm.md, crates/moqui-browser). Source scripts/wasm-env.sh first.
# An ES module factory (createMoqui) for a Web Worker or Node. QuickJS needs far more than
# emscripten's 64KB default stack; a stack overflow check fails at once without it. Memory grows
# with the entity model and the database. JSPI (no Asyncify fallback): an import may suspend the WASM
# stack on a Promise (fetch, OPFS); the suspending exports are listed in crates/moqui-browser/build.rs.
# WasmFS is the filesystem, so the OPFS backend can be mounted for durable SQLite files.
[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "link-arg=-sMODULARIZE=1",
    "-C", "link-arg=-sEXPORT_ES6=1",
    "-C", "link-arg=-sEXPORT_NAME=createMoqui",
    "-C", "link-arg=-sENVIRONMENT=web,worker,node",
    "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1",
    "-C", "link-arg=-sINITIAL_MEMORY=64MB",
    "-C", "link-arg=-sSTACK_SIZE=8MB",
    "-C", "link-arg=-sEXPORTED_RUNTIME_METHODS=HEAPU8,FS",
    "-C", "link-arg=-sJSPI",
    "-C", "link-arg=-sWASMFS",
]
