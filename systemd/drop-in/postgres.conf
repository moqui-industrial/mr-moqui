# Example, not installed by default. For Postgres on this same machine:
#   cp systemd/drop-in/postgres.conf /etc/systemd/system/moqui.service.d/postgres.conf
# A remote database needs no drop-in. The unit name is the distro's; postgresql.service is Debian
# and Fedora's usual name.

[Unit]
After=postgresql.service
Wants=postgresql.service
